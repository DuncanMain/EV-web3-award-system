name: Deploy Neverflat

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: neverflat-main-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Lowercase image name
        run: echo "IMAGE_NAME=${IMAGE_NAME,,}" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          no-cache: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Verify NEVERFLAT target before staging
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -euo pipefail
            DEPLOY_DIR=/root/neverflat
            ENV_FILE="$DEPLOY_DIR/.env"
            COMPOSE_DEST="$DEPLOY_DIR/compose.production.yaml"

            canonical_deploy_dir="$(realpath -e -- "$DEPLOY_DIR" 2>/dev/null || true)"
            [[ "$canonical_deploy_dir" == "/root/neverflat" ]] || {
              echo "NEVERFLAT target must resolve to /root/neverflat" >&2
              exit 1
            }
            [[ -f "$ENV_FILE" ]] || {
              echo "existing NEVERFLAT .env is required" >&2
              exit 1
            }
            canonical_env_file="$(realpath -e -- "$ENV_FILE" 2>/dev/null || true)"
            case "$canonical_env_file" in
              "$canonical_deploy_dir"/*) ;;
              *) echo "NEVERFLAT .env resolves outside the canonical target" >&2; exit 1 ;;
            esac

            if [[ -L "$COMPOSE_DEST" ]]; then
              echo "NEVERFLAT compose destination must not be a symlink" >&2
              exit 1
            fi
            if [[ -e "$COMPOSE_DEST" ]]; then
              canonical_compose_dest="$(realpath -e -- "$COMPOSE_DEST" 2>/dev/null || true)"
              case "$canonical_compose_dest" in
                "$canonical_deploy_dir"/*) ;;
                *) echo "NEVERFLAT compose destination resolves outside the canonical target" >&2; exit 1 ;;
              esac
            fi

            db_identity="$(docker inspect neverflat-db --format '{{index .Config.Labels "com.docker.compose.project"}}|{{index .Config.Labels "com.docker.compose.service"}}')"
            [[ "$db_identity" == "neverflat|postgres" ]] || {
              echo "neverflat-db is not the expected NEVERFLAT postgres service" >&2
              exit 1
            }
            app_inspection=""
            if app_inspection="$(docker inspect neverflat-app --format '{{index .Config.Labels "com.docker.compose.project"}}|{{index .Config.Labels "com.docker.compose.service"}}' 2>&1)"; then
              [[ "$app_inspection" == "neverflat|app" ]] || {
                echo "neverflat-app is not the expected NEVERFLAT app service" >&2
                exit 1
              }
            elif [[ "$app_inspection" != *"No such object"* && "$app_inspection" != *"No such container"* ]]; then
              echo "existing neverflat-app inspection failed" >&2
              exit 1
            fi

            docker compose version >/dev/null
            docker network inspect shared-proxy >/dev/null

      - name: Copy production compose file to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: compose.production.yaml
          target: /root/neverflat
          strip_components: 0

      - name: Deploy to server
        uses: appleboy/ssh-action@v1.2.0
        env:
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          BEIA_API_KEY: ${{ secrets.BEIA_API_KEY }}
          BEIA_ADMIN_EMAIL: ${{ secrets.BEIA_ADMIN_EMAIL }}
          BEIA_ADMIN_PASSWORD: ${{ secrets.BEIA_ADMIN_PASSWORD }}
          ADMIN_ALERT_WEBHOOK_URL: ${{ secrets.ADMIN_ALERT_WEBHOOK_URL }}
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          ADMIN_ALERT_EMAIL_FROM: ${{ secrets.ADMIN_ALERT_EMAIL_FROM }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ github.sha }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 10m
          envs: ADMIN_EMAIL,ADMIN_PASSWORD,BEIA_API_KEY,BEIA_ADMIN_EMAIL,BEIA_ADMIN_PASSWORD,ADMIN_ALERT_WEBHOOK_URL,SENDGRID_API_KEY,ADMIN_ALERT_EMAIL_FROM,GHCR_USER,GHCR_TOKEN,SOURCE_COMMIT
          script: |
            set -euo pipefail
            DEPLOY_DIR=/root/neverflat
            cd "$DEPLOY_DIR"
            ENV_FILE="$DEPLOY_DIR/.env"
            COMPOSE_FILE="$DEPLOY_DIR/compose.production.yaml"
            canonical_deploy_dir="$(realpath -e -- "$DEPLOY_DIR" 2>/dev/null || true)"
            [[ "$canonical_deploy_dir" == "/root/neverflat" ]] || {
              echo "NEVERFLAT target must resolve to /root/neverflat" >&2
              exit 1
            }
            [[ "${SOURCE_COMMIT:-}" =~ ^[0-9a-fA-F]{40}$ ]] || {
              echo "SOURCE_COMMIT must be a full source commit SHA" >&2
              exit 1
            }
            [[ -f "$ENV_FILE" && -f "$COMPOSE_FILE" ]] || {
              echo "NEVERFLAT .env and compose file are required" >&2
              exit 1
            }
            canonical_env_file="$(realpath -e -- "$ENV_FILE" 2>/dev/null || true)"
            case "$canonical_env_file" in
              "$canonical_deploy_dir"/*) ;;
              *) echo "NEVERFLAT .env resolves outside the canonical target" >&2; exit 1 ;;
            esac
            if [[ -L "$COMPOSE_FILE" ]]; then
              echo "NEVERFLAT compose file must not be a symlink" >&2
              exit 1
            fi
            canonical_compose_file="$(realpath -e -- "$COMPOSE_FILE" 2>/dev/null || true)"
            case "$canonical_compose_file" in
              "$canonical_deploy_dir"/*) ;;
              *) echo "NEVERFLAT compose file resolves outside the canonical target" >&2; exit 1 ;;
            esac
            db_identity="$(docker inspect neverflat-db --format '{{index .Config.Labels "com.docker.compose.project"}}|{{index .Config.Labels "com.docker.compose.service"}}')"
            [[ "$db_identity" == "neverflat|postgres" ]] || {
              echo "neverflat-db is not the expected NEVERFLAT postgres service" >&2
              exit 1
            }
            app_inspection=""
            if app_inspection="$(docker inspect neverflat-app --format '{{index .Config.Labels "com.docker.compose.project"}}|{{index .Config.Labels "com.docker.compose.service"}}' 2>&1)"; then
              [[ "$app_inspection" == "neverflat|app" ]] || {
                echo "neverflat-app is not the expected NEVERFLAT app service" >&2
                exit 1
              }
            elif [[ "$app_inspection" != *"No such object"* && "$app_inspection" != *"No such container"* ]]; then
              echo "existing neverflat-app inspection failed" >&2
              exit 1
            fi
            docker network inspect shared-proxy >/dev/null
            rm -f docker-compose.yaml docker-compose.yml docker-compose.dev.yaml \
              docker-compose.local.yml docker-compose.override.yml docker-stack.yml

            umask 077
            backup_dir="$DEPLOY_DIR/backups"
            [[ ! -L "$backup_dir" ]] || {
              echo "NEVERFLAT backup directory must not be a symlink" >&2
              exit 1
            }
            mkdir -p "$backup_dir"
            canonical_backup_dir="$(realpath -e -- "$backup_dir" 2>/dev/null || true)"
            case "$canonical_backup_dir" in
              "$canonical_deploy_dir"/*) ;;
              *) echo "NEVERFLAT backup directory resolves outside the canonical target" >&2; exit 1 ;;
            esac
            backup_file="$(mktemp "$backup_dir/nvf_award_${SOURCE_COMMIT}.XXXXXX.dump")"
            if ! docker exec neverflat-db pg_dump --username=postgres --dbname=nvf_award --format=custom > "$backup_file"; then
              rm -f -- "$backup_file"
              echo "NEVERFLAT PostgreSQL backup failed" >&2
              exit 1
            fi
            [[ -s "$backup_file" ]] || {
              echo "NEVERFLAT PostgreSQL backup is empty" >&2
              exit 1
            }
            docker exec -i neverflat-db pg_restore --list < "$backup_file" >/dev/null

            docker_config_dir="$(mktemp -d "$DEPLOY_DIR/.docker-config.XXXXXX")"
            cleanup_docker_config() {
              local status=$?
              if [[ -n "${docker_config_dir:-}" && -d "$docker_config_dir" && ! -L "$docker_config_dir" ]]; then
                rm -rf -- "$docker_config_dir"
              fi
              exit "$status"
            }
            trap cleanup_docker_config EXIT
            case "$docker_config_dir" in
              "$DEPLOY_DIR"/.docker-config.*) ;;
              *) echo "temporary Docker config escaped NEVERFLAT" >&2; exit 1 ;;
            esac
            chmod 700 "$docker_config_dir"
            if [[ -d /root/.docker/cli-plugins ]]; then
              ln -s /root/.docker/cli-plugins "$docker_config_dir/cli-plugins"
            fi
            export DOCKER_CONFIG="$docker_config_dir"
            printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin >/dev/null

            python3 - <<'PY'
            import os
            from pathlib import Path

            path = Path('.env')
            updates = {
                'ADMIN_EMAIL': os.environ['ADMIN_EMAIL'],
                'ADMIN_PASSWORD': os.environ['ADMIN_PASSWORD'],
                'BEIA_API_KEY': os.environ['BEIA_API_KEY'],
                'BEIA_ADMIN_EMAIL': os.environ['BEIA_ADMIN_EMAIL'],
                'BEIA_ADMIN_PASSWORD': os.environ['BEIA_ADMIN_PASSWORD'],
            }
            # A blank optional secret preserves the target-owned value. A
            # non-blank secret is the explicit configuration action.
            alert_webhook = os.environ.get('ADMIN_ALERT_WEBHOOK_URL', '').strip()
            if alert_webhook:
                updates['ADMIN_ALERT_WEBHOOK_URL'] = alert_webhook
            sendgrid_api_key = os.environ.get('SENDGRID_API_KEY', '').strip()
            if sendgrid_api_key:
                updates['SENDGRID_API_KEY'] = sendgrid_api_key
            email_from = os.environ.get('ADMIN_ALERT_EMAIL_FROM', '').strip()
            if email_from:
                updates['ADMIN_ALERT_EMAIL_FROM'] = email_from
            lines = path.read_text().splitlines() if path.exists() else []
            kept = [line for line in lines if not any(line.startswith(f'{key}=') for key in updates)]
            kept.extend(f'{key}={value}' for key, value in updates.items())
            path.write_text('\n'.join(kept) + '\n')
            PY
            docker compose -p neverflat -f compose.production.yaml pull app
            docker compose -p neverflat -f compose.production.yaml up -d --no-deps app
            healthy=0
            for _attempt in $(seq 1 24); do
              if curl --fail --silent --show-error --max-time 5 http://127.0.0.1:3005/ingest/health >/dev/null; then
                healthy=1
                break
              fi
              sleep 5
            done
            if (( healthy != 1 )); then
              echo "Neverflat /ingest/health did not become ready" >&2
              exit 1
            fi

      - name: Set up Node 22 for bounded live API smoke
        timeout-minutes: 5
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify deployed API contract with read-only smoke
        timeout-minutes: 5
        env:
          BEIA_API_KEY: ${{ secrets.BEIA_API_KEY }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: node scripts/verify-live-api-smoke.js

      - name: Upload sanitized live API smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neverflat-live-api-smoke-${{ github.run_id }}
          path: outputs/live-api-remediation-2026-10-14/live-api-smoke.json
          if-no-files-found: warn
          retention-days: 14
