name: Deploy Neverflat

on:
  push:
    branches:
      - main

concurrency:
  group: neverflat-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/zentrixlab/neverflat
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-deploy:
    if: github.repository == 'ZentrixLab/neverflat'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push immutable Docker image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          no-cache: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Preflight existing target
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: scripts/preflight_production.py
          target: /tmp/neverflat-preflight-${{ github.sha }}
          strip_components: 1

      - name: Run preflight before staging the release
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE_REFERENCE: ${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 10m
          envs: IMAGE_REFERENCE
          script: |
            set -euo pipefail
            python3 /tmp/neverflat-preflight-${{ github.sha }}/preflight_production.py \
              --deploy-dir /root/neverflat \
              --env-file /root/neverflat/.env \
              --image-reference "$IMAGE_REFERENCE"
            mkdir -p /root/neverflat/releases/${{ github.sha }}
            rm -f /tmp/neverflat-preflight-${{ github.sha }}/preflight_production.py

      - name: Stage release files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: compose.production.yaml,scripts/deploy_production.sh,scripts/preflight_production.py,scripts/check_production_acceptance.py
          target: /root/neverflat/releases/${{ github.sha }}
          strip_components: 0

      - name: Validate and deploy staged release
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE_REFERENCE: ${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ github.token }}
          DEPLOY_DIR: /root/neverflat
          RELEASE_DIR: /root/neverflat/releases/${{ github.sha }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 10m
          envs: IMAGE_REFERENCE,GHCR_USER,GHCR_TOKEN,DEPLOY_DIR,RELEASE_DIR
          script: |
            set -euo pipefail
            chmod 700 "$RELEASE_DIR/scripts/deploy_production.sh"
            chmod 600 "$RELEASE_DIR/scripts/preflight_production.py" "$RELEASE_DIR/scripts/check_production_acceptance.py"
            IMAGE_REFERENCE="$IMAGE_REFERENCE" \
              GHCR_USER="$GHCR_USER" \
              GHCR_TOKEN="$GHCR_TOKEN" \
              DEPLOY_DIR="$DEPLOY_DIR" \
              RELEASE_DIR="$RELEASE_DIR" \
              "$RELEASE_DIR/scripts/deploy_production.sh"
